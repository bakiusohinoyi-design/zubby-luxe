v><div class="pnl"><h3>Newsletter</h3>${fld("Title","news.title")}${fld("Text","news.desc")}</div><div class="pnl"><h3>Trust information</h3>${d.trust.map((t,i)=>`<div class="fgrid">${fld("Title "+(i+1),"trust."+i+".0")}${fld("Text","trust."+i+".1")}</div>`).join("")}</div><div class="pnl"><h3>Section order &amp; visibility</h3>${d.secs.map((s,i)=>`<div class="row" style="align-items:end"><div style="flex:1;min-width:200px">${fld("Section title","secs."+i+".title")}</div>${s.max!==undefined?`<div style="width:90px">${fld("Max","secs."+i+".max","number")}</div>`:""}${fld("Visible","secs."+i+".on","ck")}<button class="btn o sm" data-act="mv" data-i="${i}" data-d="-1">↑</button><button class="btn o sm" data-act="mv" data-i="${i}" data-d="1">↓</button></div>`).join("")}</div>`},

function up(f,cb){if(!f)return;if(f.size>8e6)return toast("Image too large (max 8MB)",1);const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.8))};i.onerror=()=>toast("Not a valid image",1);i.src=r.result};r.readAsDataURL(f)}
